name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bunx eslint src/lib scripts

      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-incremental-${{ runner.os }}-${{ hashFiles('bun.lock', 'astro.config.ts', 'src/pages/**') }}
          restore-keys: |
            astro-incremental-${{ runner.os }}-

      - run: bun run build

      - run: bun run cwv:check

      - run: bun run format:check
